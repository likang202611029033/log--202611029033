<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小账簿 · 记账本</title>
<meta name="description" content="一个轻量的本地记账网页：记录支出与转入，自动汇总月度结余与支出构成。">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%231E6B57'/><text x='16' y='22' font-size='16' text-anchor='middle' fill='white' font-family='sans-serif' font-weight='bold'>¥</text></svg>">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.1/dist/echarts.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F2F4F1;--surface:#FFFFFF;--ink:#1C2822;--ink-2:#52625B;--ink-3:#8A9891;
  --line:#E1E7E2;--brand:#1E6B57;--brand-soft:#E4F0EB;
  --exp:#D9684F;--exp-soft:#F9E9E3;
  --inc:#2E9E6B;--inc-soft:#E1F3E9;
  --r-lg:18px;--r-md:14px;--r-sm:10px;
  --shadow:0 1px 2px rgba(24,40,32,.05),0 10px 30px rgba(24,40,32,.07)
}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.5;min-height:100vh;
  background-image:radial-gradient(1100px 460px at 82% -12%,#DFEAE3 0%,transparent 60%)
}
button{font-family:inherit}
.wrap{max-width:1060px;margin:0 auto;padding:20px 16px 64px}
/* ===== 顶栏 ===== */
.masthead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:6px 2px 18px}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;letter-spacing:.5px}
.brand .mark{width:36px;height:36px;border-radius:11px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.brand .mark svg{width:20px;height:20px}
.brand small{font-size:12px;color:var(--ink-3);font-weight:400;margin-left:2px;letter-spacing:0}
.month-nav{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:4px;box-shadow:var(--shadow)}
.month-nav button{border:0;background:transparent;width:44px;height:44px;border-radius:50%;cursor:pointer;color:var(--ink-2);display:flex;align-items:center;justify-content:center;transition:background .15s,color .15s}
.month-nav button svg{width:16px;height:16px}
.month-nav button:hover:not(:disabled){background:var(--brand-soft);color:var(--brand)}
.month-nav button:disabled{color:#C9D2CC;cursor:default}
.month-nav .ml{min-width:88px;text-align:center;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
/* ===== 布局 ===== */
.grid{display:grid;grid-template-columns:400px 1fr;gap:18px;align-items:start}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
/* ===== 汇总 ===== */
.summary{padding:20px 22px}
.summary .cap{font-size:13px;color:var(--ink-3);display:flex;justify-content:space-between;align-items:center}
.summary .hint{font-size:12px}
.summary .bal{font-size:38px;font-weight:700;letter-spacing:-1px;margin-top:6px;font-variant-numeric:tabular-nums;line-height:1.2}
.summary .bal.neg{color:var(--exp)}
.summary .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}
.stat{background:var(--bg);border-radius:var(--r-md);padding:10px 14px}
.stat .t{font-size:12px;color:var(--ink-3);display:flex;align-items:center;gap:6px}
.stat .v{font-size:17px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.exp{background:var(--exp)}.dot.inc{background:var(--inc)}
/* ===== 记账表单 ===== */
.form-card{padding:18px;--accent:var(--exp);--soft:var(--exp-soft)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;padding:12px 0;border-radius:9px;font-size:14px;font-weight:600;color:var(--ink-2);cursor:pointer;transition:background .15s,color .15s}
.seg button.on{background:var(--surface);color:var(--accent);box-shadow:0 1px 4px rgba(24,40,32,.10)}
.amount{display:flex;align-items:baseline;gap:8px;margin:18px 6px 2px}
.amount .cur{font-size:24px;font-weight:600;color:var(--ink-2)}
.amount input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:40px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--ink);font-family:inherit}
.amount input::placeholder{color:#C6CEC9}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 16px}
.cat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 4px;border:1px solid var(--line);background:var(--surface);border-radius:12px;cursor:pointer;font-size:13px;color:var(--ink-2);transition:border-color .12s,background .12s,color .12s}
.cat svg{width:20px;height:20px;color:var(--ink-3);transition:color .12s}
.cat:hover{border-color:var(--ink-3)}
.cat.on{border-color:var(--accent);background:var(--soft);color:var(--ink)}
.cat.on svg{color:var(--accent)}
.frow{display:grid;grid-template-columns:1fr 1.5fr;gap:10px}
.frow input{border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:16px;color:var(--ink);background:var(--surface);outline:0;font-family:inherit;min-width:0}
.frow input::placeholder{color:#B9C4BD}
.frow input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(30,107,87,.12)}
.submit{width:100%;margin-top:14px;border:0;border-radius:14px;padding:14px;font-size:16px;font-weight:600;color:#fff;background:var(--accent);cursor:pointer;transition:filter .15s,transform .1s}
.submit:hover{filter:brightness(1.06)}
.submit:active{transform:scale(.99)}
/* ===== 图表 ===== */
.card-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 0;font-size:15px;font-weight:600}
.card-head .hint{font-size:12px;color:var(--ink-3);font-weight:400;font-variant-numeric:tabular-nums}
#chart{height:252px;width:100%}
.chart-empty{height:252px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--ink-3);font-size:13px}
.chart-empty .empty-ic{width:52px;height:52px;border-radius:16px;background:var(--bg);color:#B9C4BD;display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.chart-empty .empty-ic svg{width:26px;height:26px}
/* ===== 明细 ===== */
.records-card{padding-bottom:12px}
.rec-list{padding:6px 14px 8px}
.day{display:flex;align-items:center;gap:10px;padding:14px 6px 6px;font-size:12px;color:var(--ink-3)}
.day::after{content:"";flex:1;height:1px;background:var(--line)}
.rec{display:flex;align-items:center;gap:12px;padding:11px 8px;border-radius:12px;transition:background .12s}
.rec:hover{background:var(--bg)}
.rec-ic{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex:none}
.rec-ic svg{width:19px;height:19px}
.rec-ic.exp{background:var(--exp-soft);color:var(--exp)}
.rec-ic.inc{background:var(--inc-soft);color:var(--inc)}
.rec-info{flex:1;min-width:0}
.rec-cat{font-size:14px;font-weight:500}
.rec-note{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-amt{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;flex:none}
.rec-amt.exp{color:var(--exp)}.rec-amt.inc{color:var(--inc)}
.del{border:0;background:transparent;color:#B9C4BD;cursor:pointer;width:44px;height:44px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;transition:background .12s,color .12s}
.del svg{width:15px;height:15px}
.del:hover{background:#F2D9D1;color:var(--exp)}
.del.confirm{background:var(--exp);color:#fff;font-size:11px;width:auto;padding:0 10px;font-weight:600}
.empty-state{padding:34px 20px;text-align:center}
.empty-state .empty-ic{width:52px;height:52px;border-radius:16px;background:var(--bg);color:#B9C4BD;display:flex;align-items:center;justify-content:center;margin:0 auto 12px}
.empty-state .empty-ic svg{width:26px;height:26px}
.empty-state p{color:var(--ink-2);font-size:14px}
.empty-state .sub{color:var(--ink-3);font-size:12px;margin-top:4px}
/* ===== Toast ===== */
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(18px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50;box-shadow:0 8px 24px rgba(24,40,32,.22)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ===== 响应式 ===== */
@media (max-width:920px){
  .grid{grid-template-columns:1fr}
  .wrap{padding:14px 12px 60px}
}
@media (max-width:640px){
  .masthead{flex-wrap:wrap;padding-bottom:12px}
  .brand small{display:none}
  .summary .bal{font-size:32px}
  .amount input{font-size:34px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div class="brand">
      <span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14v16H5z"/><path d="M9 8h6M9 12h6M9 16h4"/></svg></span>
      小账簿<small>记下每一笔，心里有数</small>
    </div>
    <div class="month-nav">
      <button type="button" id="prevM" aria-label="上个月"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg></button>
      <span class="ml" id="monthLabel">—</span>
      <button type="button" id="nextM" aria-label="下个月"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></button>
    </div>
  </header>

  <div class="grid">
    <div class="col">
      <section class="card summary" aria-label="月度汇总">
        <div class="cap"><span>本月结余</span><span class="hint" id="sumMonth"></span></div>
        <div class="bal" id="balance">¥ 0.00</div>
        <div class="stats">
          <div class="stat"><div class="t"><span class="dot exp"></span>支出</div><div class="v" id="sumExp">¥ 0.00</div></div>
          <div class="stat"><div class="t"><span class="dot inc"></span>转入</div><div class="v" id="sumInc">¥ 0.00</div></div>
        </div>
      </section>

      <section class="card form-card" id="formCard" aria-label="记账表单">
        <div class="seg" id="seg" role="tablist" aria-label="收支类型">
          <button type="button" class="on" data-type="expense" role="tab" aria-selected="true">支出</button>
          <button type="button" data-type="income" role="tab" aria-selected="false">转入</button>
        </div>
        <div class="amount">
          <span class="cur">¥</span>
          <input id="amount" type="text" inputmode="decimal" autocomplete="off" placeholder="0.00" aria-label="金额">
        </div>
        <div class="cats" id="cats" role="radiogroup" aria-label="分类"></div>
        <div class="frow">
          <input type="date" id="date" aria-label="日期">
          <input type="text" id="note" placeholder="备注（可选）" maxlength="30" aria-label="备注">
        </div>
        <button type="button" class="submit" id="submitBtn">记一笔支出</button>
      </section>
    </div>

    <div class="col">
      <section class="card" aria-label="支出构成">
        <div class="card-head"><span>支出构成</span><span class="hint" id="chartHint">本月</span></div>
        <div id="chart" role="img" aria-label="支出分类占比图"></div>
        <div class="chart-empty" id="chartEmpty" hidden>
          <div class="empty-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 3.5a10.5 10.5 0 1 0 0 17"/><path d="M3.5 3.5v5h5"/></svg></div>
          <span>本月还没有支出，记一笔看看分布</span>
        </div>
      </section>

      <section class="card records-card" aria-label="明细">
        <div class="card-head"><span>明细</span><span class="hint" id="recCount"></span></div>
        <div class="rec-list" id="recList"></div>
      </section>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
/* ================= 数据与常量 ================= */
const ICONS = {
  food:'<path d="M6 3v6a3 3 0 0 0 6 0V3"/><path d="M9 9v12"/><path d="M18 3c-1.8 0-3.2 2.2-3.2 5s1.4 5 3.2 5"/><path d="M18 3v18"/>',
  transit:'<rect x="5" y="3" width="14" height="14" rx="2"/><path d="M5 11h14"/><circle cx="9" cy="18.5" r="1.8"/><circle cx="15" cy="18.5" r="1.8"/>',
  shop:'<path d="M6 8h12l1 12H5L6 8z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
  home:'<path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v10h13V10"/>',
  fun:'<rect x="2.5" y="7" width="19" height="11" rx="5.5"/><path d="M7 10.5v4M5 12.5h4"/><circle cx="16.5" cy="12" r=".6"/><circle cx="18.5" cy="14" r=".6"/>',
  med:'<path d="M12 4v16M4 12h16"/>',
  edu:'<path d="M12 6.5C10 4.8 7.2 4.5 4 4.5v13c3.2 0 6 .3 8 2 2-1.7 4.8-2 8-2v-13c-3.2 0-6 .3-8 2z"/><path d="M12 6.5v13"/>',
  gift:'<rect x="3.5" y="9" width="17" height="11" rx="1.5"/><path d="M12 9v11M3.5 13h17"/><path d="M12 9c-2.6 0-4.6-1.7-4.6-3.6C7.4 3.6 9.2 2 11 3c.7.5 1 1.5 1 3 0-1.5.3-2.5 1-3 1.8-1 3.6.6 3.6 2.4C16.6 7.3 14.6 9 12 9z"/>',
  other:'<circle cx="12" cy="5" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="12" cy="19" r="1.4"/>',
  salary:'<path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4h-4z"/>',
  bonus:'<path d="M12 3l2.6 5.6 6.1.8-4.5 4.2 1.2 6L12 16.6 6.6 19.6l1.2-6L3.3 9.4l6.1-.8L12 3z"/>',
  invest:'<path d="M3.5 16.5 9 11l4 4 7.5-8"/><path d="M15 7h5.5v5.5"/>',
  refund:'<path d="M3.5 12a8.5 8.5 0 1 0 2.5-6"/><path d="M3 3.5v5h5"/>',
  reimburse:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2V3z"/><path d="M9.5 8h5M9.5 12h5"/>'
};
const CATS = {
  expense:[
    {id:'food',name:'餐饮',icon:'food'},{id:'transit',name:'交通',icon:'transit'},
    {id:'shop',name:'购物',icon:'shop'},{id:'home',name:'居住',icon:'home'},
    {id:'fun',name:'娱乐',icon:'fun'},{id:'med',name:'医疗',icon:'med'},
    {id:'edu',name:'教育',icon:'edu'},{id:'gift',name:'人情',icon:'gift'},
    {id:'other',name:'其他',icon:'other'}
  ],
  income:[
    {id:'salary',name:'工资',icon:'salary'},{id:'bonus',name:'奖金',icon:'bonus'},
    {id:'invest',name:'理财',icon:'invest'},{id:'refund',name:'退款',icon:'refund'},
    {id:'reimburse',name:'报销',icon:'reimburse'},{id:'other',name:'其他',icon:'other'}
  ]
};
const META = { expense:{label:'支出',color:'#D9684F',soft:'#F9E9E3'}, income:{label:'转入',color:'#2E9E6B',soft:'#E1F3E9'} };
const PALETTE = ['#D9684F','#E09B3D','#2E9E6B','#4A7FB5','#8A6FC0','#C4658F','#5C7A78','#9AA29A'];
const KEY = 'xiaozhangbu_records_v1';
const DEL_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M6.5 7l1 13h9l1-13"/></svg>';

let records = load();
const state = { tab:'expense', month:monthKey(new Date()), cat:'food' };

/* ================= 工具函数 ================= */
function $(id){ return document.getElementById(id); }
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)) || []; }catch(e){ return []; } }
function save(){ localStorage.setItem(KEY, JSON.stringify(records)); }
function pad(n){ return String(n).padStart(2,'0'); }
function monthKey(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function todayStr(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function monthLabel(mk){ const p=mk.split('-'); return p[0]+'年'+Number(p[1])+'月'; }
function shiftMonth(mk,delta){ const p=mk.split('-').map(Number); return monthKey(new Date(p[0],p[1]-1+delta,1)); }
function fmt(n){ return '¥ '+n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtAmt(n){ return n.toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function nowId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,6); }
function esc(s){ return s.replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function weekLabel(ds){ return ['周日','周一','周二','周三','周四','周五','周六'][new Date(ds+'T00:00:00').getDay()]; }
function dayLabel(ds){ const p=ds.split('-'); return Number(p[1])+'月'+Number(p[2])+'日'; }
function ic(name){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+ICONS[name]+'</svg>'; }
function parseAmount(v){
  if(!v) return 0;
  const s=String(v).replace(/[,\s]/g,'');
  if(!/^\d+(\.\d{1,2})?$/.test(s)) return 0;
  const n=parseFloat(s);
  if(!(n>0)||n>99999999.99) return 0;
  return Math.round(n*100)/100;
}
function canNext(){ return state.month < monthKey(new Date()); }

/* ================= 渲染 ================= */
function renderAll(){
  $('monthLabel').textContent = monthLabel(state.month);
  $('nextM').disabled = !canNext();
  $('sumMonth').textContent = monthLabel(state.month)+'结余';
  renderForm(); renderSummary(); renderChart(); renderList();
}
function renderForm(){
  const seg=document.getElementById('seg');
  [...seg.querySelectorAll('button')].forEach(function(b){ b.classList.toggle('on', b.dataset.type===state.tab); b.setAttribute('aria-selected', b.dataset.type===state.tab); });
  const meta=META[state.tab];
  const card=$('formCard');
  card.style.setProperty('--accent',meta.color);
  card.style.setProperty('--soft',meta.soft);
  $('submitBtn').textContent = '记一笔'+meta.label;
  $('cats').innerHTML = CATS[state.tab].map(function(c){
    const on=c.id===state.cat;
    return '<button type="button" class="cat'+(on?' on':'')+'" data-cat="'+c.id+'" role="radio" aria-checked="'+on+'">'+ic(c.icon)+'<span>'+c.name+'</span></button>';
  }).join('');
}
function renderSummary(){
  let exp=0,inc=0;
  records.forEach(function(r){ if(r.date.slice(0,7)!==state.month) return; if(r.type==='expense') exp+=r.amount; else inc+=r.amount; });
  const bal=inc-exp;
  const be=$('balance');
  be.textContent=fmt(bal);
  be.classList.toggle('neg',bal<0);
  $('sumExp').textContent=fmt(exp);
  $('sumInc').textContent=fmt(inc);
}
function renderChart(){
  const el=$('chart'), empty=$('chartEmpty');
  const exp=records.filter(function(r){ return r.type==='expense' && r.date.slice(0,7)===state.month; });
  if(!exp.length){ el.style.display='none'; empty.hidden=false; $('chartHint').textContent='本月'; return; }
  empty.hidden=true; el.style.display='block';
  const map={};
  exp.forEach(function(r){ const c=CATS.expense.find(function(x){return x.id===r.cat;}); const nm=c?c.name:'其他'; map[nm]=(map[nm]||0)+r.amount; });
  const total=exp.reduce(function(s,r){return s+r.amount;},0);
  $('chartHint').textContent='本月 ¥ '+fmtAmt(total);
  if(!window.echarts) return;
  const data=Object.keys(map).map(function(k){ return {name:k,value:Math.round(map[k]*100)/100}; }).sort(function(a,b){return b.value-a.value;});
  if(!window._chart){ window._chart=echarts.init(el); }
  window._chart.setOption({
    tooltip:{ trigger:'item', formatter:function(p){ return p.marker+' '+p.name+'：¥ '+fmtAmt(p.value)+'（'+p.percent+'%）'; } },
    legend:{ bottom:0, icon:'circle', itemWidth:9, itemHeight:9, itemGap:14, textStyle:{color:'#52625B',fontSize:12} },
    series:[{ type:'pie', radius:['52%','74%'], center:['50%','44%'], avoidLabelOverlap:true,
      itemStyle:{ borderColor:'#fff', borderWidth:2, borderRadius:6 },
      label:{ show:false },
      data:data.map(function(d,i){ d.itemStyle={color:PALETTE[i%PALETTE.length]}; return d; })
    }]
  },true);
}
function renderList(){
  const list=$('recList');
  const recs=records.filter(function(r){ return r.date.slice(0,7)===state.month; })
    .sort(function(a,b){ return b.date.localeCompare(a.date) || b.createdAt-a.createdAt; });
  $('recCount').textContent = recs.length ? recs.length+' 笔' : '';
  if(!recs.length){
    list.innerHTML='<div class="empty-state"><div class="empty-ic">'+ic('other')+'</div><p>'+monthLabel(state.month)+'还没有记录</p><p class="sub">记一笔支出或转入吧</p></div>';
    return;
  }
  let html='',lastDay='';
  recs.forEach(function(r){
    if(r.date!==lastDay){ html+='<div class="day">'+dayLabel(r.date)+' · '+weekLabel(r.date)+'</div>'; lastDay=r.date; }
    const cat=CATS[r.type].find(function(c){return c.id===r.cat;})||CATS[r.type][CATS[r.type].length-1];
    const sign=r.type==='expense'?'-':'+';
    html+='<div class="rec">'
      +'<div class="rec-ic '+r.type+'">'+ic(cat.icon)+'</div>'
      +'<div class="rec-info"><div class="rec-cat">'+cat.name+'</div><div class="rec-note">'+(r.note?esc(r.note):'无备注')+'</div></div>'
      +'<div class="rec-amt '+r.type+'">'+sign+'¥ '+fmtAmt(r.amount)+'</div>'
      +'<button type="button" class="del" data-id="'+r.id+'" aria-label="删除这笔记录">'+DEL_ICON+'</button>'
      +'</div>';
  });
  list.innerHTML=html;
}
/* ================= 交互 ================= */
let toastTimer;
function toast(msg){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer=setTimeout(function(){ t.classList.remove('show'); },1800);
}
function submit(){
  const amount=parseAmount($('amount').value);
  if(!amount){ $('amount').focus(); toast('请输入正确的金额'); return; }
  const date=$('date').value || todayStr();
  records.push({ id:nowId(), type:state.tab, amount:amount, cat:state.cat, note:$('note').value.trim().slice(0,30), date:date, createdAt:Date.now() });
  save();
  $('amount').value=''; $('note').value=''; $('date').value=todayStr();
  renderAll();
  toast('已记一笔'+META[state.tab].label+' ¥ '+fmtAmt(amount));
}
$('submitBtn').addEventListener('click',submit);
$('amount').addEventListener('keydown',function(e){ if(e.key==='Enter') submit(); });
$('note').addEventListener('keydown',function(e){ if(e.key==='Enter') submit(); });
$('amount').addEventListener('input',function(){
  let s=this.value.replace(/[^\d.]/g,'');
  const i=s.indexOf('.');
  if(i>=0){ s=s.slice(0,i+1)+s.slice(i+1).replace(/\./g,'').slice(0,2); }
  if(s!==this.value) this.value=s;
});
$('seg').addEventListener('click',function(e){
  const b=e.target.closest('button'); if(!b) return;
  state.tab=b.dataset.type;
  if(!CATS[state.tab].some(function(c){return c.id===state.cat;})) state.cat=CATS[state.tab][0].id;
  renderForm();
});
$('cats').addEventListener('click',function(e){
  const b=e.target.closest('.cat'); if(!b) return;
  state.cat=b.dataset.cat; renderForm();
});
$('prevM').addEventListener('click',function(){ state.month=shiftMonth(state.month,-1); renderAll(); });
$('nextM').addEventListener('click',function(){ if(!canNext()) return; state.month=shiftMonth(state.month,1); renderAll(); });
$('recList').addEventListener('click',function(e){
  const btn=e.target.closest('.del'); if(!btn) return;
  if(btn.classList.contains('confirm')){
    records=records.filter(function(r){ return r.id!==btn.dataset.id; });
    save(); renderAll(); toast('已删除这笔记录');
  }else{
    btn.classList.add('confirm'); btn.textContent='确定?';
    clearTimeout(btn._t);
    btn._t=setTimeout(function(){ btn.classList.remove('confirm'); btn.textContent=''; btn.innerHTML=DEL_ICON; },2600);
  }
});
window.addEventListener('resize',function(){ if(window._chart) window._chart.resize(); });
/* ================= 初始化 ================= */
$('date').value=todayStr();
renderAll();
</script>
</body>
</html>
