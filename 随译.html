<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#EFF2F0;--surface:#FFFFFF;--ink:#1A2421;--ink-2:#56645F;--ink-3:#8C9994;
  --line:#DFE7E3;--brand:#0E7C72;--brand-soft:#E3F1EE;--brand-ink:#0B5B54;
  --r-lg:18px;--r-md:14px;--r-sm:10px;
  --shadow:0 1px 2px rgba(16,32,28,.05),0 10px 30px rgba(16,32,28,.07)
}
html{-webkit-text-size-adjust:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--ink);line-height:1.55;min-height:100vh;
  background-image:radial-gradient(1100px 460px at 12% -12%,#DFECE8 0%,transparent 60%)
}
button{font-family:inherit}
select{font-family:inherit}
.wrap{max-width:880px;margin:0 auto;padding:20px 16px 56px}
/* ===== 顶栏 ===== */
.masthead{display:flex;align-items:center;gap:10px;padding:6px 2px 18px}
.brand{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:700;letter-spacing:.5px}
.brand .mark{width:36px;height:36px;border-radius:11px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.brand .mark svg{width:20px;height:20px}
.brand small{font-size:12px;color:var(--ink-3);font-weight:400;margin-left:2px;letter-spacing:0}
/* ===== 卡片 ===== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow)}
.translator{padding:18px}
/* ===== 语言栏 ===== */
.langbar{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.sel{position:relative;flex:1;min-width:0}
.sel select{
  width:100%;appearance:none;-webkit-appearance:none;border:1px solid var(--line);border-radius:12px;
  padding:11px 34px 11px 14px;font-size:15px;font-weight:500;color:var(--ink);background:var(--surface);
  cursor:pointer;outline:0;transition:border-color .15s,box-shadow .15s
}
.sel select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(14,124,114,.13)}
.sel::after{
  content:"";position:absolute;right:13px;top:50%;width:9px;height:9px;margin-top:-7px;
  border-right:2px solid var(--ink-3);border-bottom:2px solid var(--ink-3);transform:rotate(45deg);pointer-events:none
}
.swap-btn{
  width:44px;height:44px;flex:none;border:1px solid var(--line);border-radius:50%;background:var(--surface);
  color:var(--brand);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,transform .15s,color .15s
}
.swap-btn:hover{background:var(--brand-soft)}
.swap-btn:active{transform:rotate(180deg)}
.swap-btn svg{width:19px;height:19px}
/* ===== 双语面板 ===== */
.panes{display:grid;grid-template-columns:1fr 46px 1fr;gap:12px;align-items:stretch}
.pane{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-md);background:var(--surface);transition:border-color .15s,box-shadow .15s;min-height:220px;overflow:hidden}
.pane:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px rgba(14,124,114,.12)}
.pane textarea{
  flex:1;width:100%;min-height:170px;border:0;outline:0;resize:vertical;padding:14px 16px;
  font-size:16px;line-height:1.7;color:var(--ink);background:transparent;font-family:inherit
}
.pane textarea::placeholder{color:#B7C2BD}
.out-text{
  flex:1;min-height:170px;padding:14px 16px;font-size:16px;line-height:1.7;color:var(--ink);
  white-space:pre-wrap;word-break:break-word;background:#F7F9F8;outline:0
}
.out-text.placeholder{color:#B7C2BD}
.pane-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px 10px 16px;border-top:1px dashed var(--line)}
.meta{font-size:12px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.pane-actions{display:flex;gap:6px}
.ghost{
  border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:7px 12px;font-size:13px;
  color:var(--ink-2);cursor:pointer;transition:background .12s,color .12s,border-color .12s
}
.ghost:hover:not(:disabled){background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink)}
.ghost:disabled{opacity:.45;cursor:default}
.connector{align-self:center;justify-self:center;width:44px;height:44px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:flex;align-items:center;justify-content:center}
.connector svg{width:20px;height:20px}
/* ===== 操作栏 ===== */
.ctrlbar{display:flex;align-items:center;gap:14px;margin-top:14px}
.primary{
  flex:none;border:0;border-radius:14px;padding:13px 34px;font-size:16px;font-weight:600;color:#fff;
  background:var(--brand);cursor:pointer;transition:filter .15s,transform .1s;letter-spacing:2px
}
.primary:hover{filter:brightness(1.07)}
.primary:active{transform:scale(.99)}
.primary:disabled{opacity:.6;cursor:default}
.status{font-size:13px;color:var(--ink-3);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.status.err{color:#C0563C}
.status.ok{color:var(--brand-ink)}
.kbd{font-size:11px;color:var(--ink-3);border:1px solid var(--line);border-radius:5px;padding:1px 6px;background:var(--bg)}
/* ===== 示例 ===== */
.samples{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.s-label{font-size:12px;color:var(--ink-3);margin-right:2px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13px;color:var(--ink-2);cursor:pointer;transition:background .12s,color .12s,border-color .12s}
.chip:hover{background:var(--brand-soft);border-color:var(--brand);color:var(--brand-ink)}
/* ===== 模式切换 ===== */
.modebar{display:flex;justify-content:flex-end;margin-bottom:12px}
.seg-mini{display:inline-grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:10px;padding:3px;gap:3px}
.seg-mini button{border:0;background:transparent;padding:7px 18px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;transition:background .15s,color .15s}
.seg-mini button.on{background:var(--surface);color:var(--brand);box-shadow:0 1px 3px rgba(16,32,28,.12)}
/* ===== 文件模式 ===== */
.dropzone{
  border:1.5px dashed #B9CBC5;border-radius:var(--r-md);background:#FAFCFB;
  padding:30px 18px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  text-align:center;cursor:pointer;transition:border-color .15s,background .15s;min-height:150px
}
.dropzone:hover,.dropzone:focus-visible,.dropzone.drag{border-color:var(--brand);background:var(--brand-soft)}
.dropzone svg{width:34px;height:34px;color:var(--brand)}
.dz-title{font-size:15px;font-weight:600;color:var(--ink)}
.dz-sub{font-size:12px;color:var(--ink-3)}
.fileinfo{margin-top:10px;border:1px solid var(--line);border-radius:var(--r-md);padding:10px 14px}
.file-badge{display:flex;align-items:center;gap:8px}
.file-badge svg{width:18px;height:18px;color:var(--brand);flex:none}
.file-name{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:0}
.file-size{font-size:12px;color:var(--ink-3);flex:none}
.ghost.sm{padding:5px 10px;font-size:12px;min-height:0}
.file-preview{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:12px;color:var(--ink-3);max-height:96px;overflow:hidden;line-height:1.7}
.translator.file-mode .src-pane,.translator.file-mode .connector{display:none}
.translator.file-mode .panes{grid-template-columns:1fr}
.translator.file-mode .samples{display:none}
/* ===== 历史 ===== */
.history{margin-top:16px;padding-bottom:10px}
.card-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 6px;font-size:15px;font-weight:600}
.hist-list{padding:4px 12px 8px}
.hist-item{display:flex;align-items:flex-start;gap:10px;padding:12px 10px;border-radius:12px;cursor:pointer;transition:background .12s}
.hist-item:hover{background:var(--bg)}
.hist-badges{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px;padding-top:2px}
.hist-tag{font-size:11px;color:var(--brand-ink);background:var(--brand-soft);border-radius:6px;padding:2px 8px;white-space:nowrap}
.hist-time{font-size:11px;color:var(--ink-3)}
.hist-body{flex:1;min-width:0}
.hist-line{font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hist-line + .hist-line{margin-top:3px;color:var(--ink)}
.hist-del{border:0;background:transparent;color:#B9C4BD;cursor:pointer;width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;transition:background .12s,color .12s}
.hist-del svg{width:14px;height:14px}
.hist-del:hover{background:#F2D9D1;color:#C0563C}
.empty-state{padding:26px 18px;text-align:center;color:var(--ink-3);font-size:13px}
/* ===== 页脚 ===== */
.note{margin-top:18px;text-align:center;font-size:12px;color:var(--ink-3);line-height:1.8}
/* ===== Toast ===== */
.toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(18px);background:var(--ink);color:#fff;padding:10px 20px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:50;box-shadow:0 8px 24px rgba(16,32,28,.22);max-width:86vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ===== 响应式 ===== */
@media (max-width:680px){
  .wrap{padding:14px 12px 48px}
  .panes{grid-template-columns:1fr}
  .connector{transform:rotate(90deg)}
  .pane{min-height:0}
  .pane textarea,.out-text{min-height:120px}
  .ctrlbar{flex-wrap:wrap}
  .status{width:100%;order:3;white-space:normal}
  .ghost{padding:10px 14px;min-height:44px}
  .chip{padding:9px 16px;min-height:44px}
  .seg-mini button{padding:10px 20px;min-height:44px}
}
</style>
</head>

function detectLang(t){
  const ja=/[\u3040-\u30ff]/; const ko=/[\uac00-\ud7af]/; const cjk=/[\u4e00-\u9fff]/;
  const th=/[\u0e00-\u0e7f]/; const ar=/[\u0600-\u06ff]/; const cyr=/[\u0400-\u04ff]/;
  if(ja.test(t)) return 'ja';
  if(ko.test(t)) return 'ko';
  if(cjk.test(t)){
    let hit=0,total=0;
    for(const ch of t){ if(cjk.test(ch)){ total++; if(TW_HINTS.indexOf(ch)>=0) hit++; } }
    return (total>0 && hit/total>0.12) ? 'zh-TW' : 'zh-CN';
  }
  if(th.test(t)) return 'th';
  if(ar.test(t)) return 'ar';
  if(cyr.test(t)) return 'ru';
  return 'en';
}
/* 长文本分段：优先按句末符号切，装进 <=MAX_CHUNK 的块 */
function chunk(text, max){
  const segs=text.match(/[^。！？；.!?，,\n]+[。！？；.!?，,]?|\n+/g) || [text];
  const chunks=[]; let cur='';
  for(const s of segs){
    if(s.length>max){
      if(cur){ chunks.push(cur); cur=''; }
      for(let i=0;i<s.length;i+=max) chunks.push(s.slice(i,i+max));
      continue;
    }
    if((cur+s).length>max){ chunks.push(cur); cur=s; }
    else cur+=s;
  }
  if(cur) chunks.push(cur);
  return chunks.filter(function(c){ return c.trim(); });
}
/* ================= 翻译 ================= */
async function translateChunk(q, from, to){
  const url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(q)
    +'&langpair='+encodeURIComponent(from+'|'+to);
  const res=await fetch(url);
  if(!res.ok) throw new Error('HTTP '+res.status);
  const d=await res.json();
  if(d.responseStatus!==200 || !d.responseData) throw new Error(d.responseDetails||'接口返回异常');
  const t=(d.responseData.translatedText||'').trim();
  if(!t) throw new Error('该语对暂无翻译结果');
  if(d.quotaFinished===true) throw new Error('今日免费额度已用尽');
  return t;
}
async function translateAll(text, from, to, onProgress){
  const chunks=chunk(text, MAX_CHUNK);
  const out=[];
  for(let i=0;i<chunks.length;i++){
    if(chunks.length>1) onProgress(i+1, chunks.length);
    out.push(await translateChunk(chunks[i], from, to));
    if(i<chunks.length-1) await sleep(130);
  }
  return out.join('');
}
function copyText(s){
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(s).then(function(){ toast('已复制'); },function(){ legacyCopy(s); });
  }else legacyCopy(s);
}
function legacyCopy(s){
  const ta=document.createElement('textarea');
  ta.value=s; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); toast('已复制'); }catch(e){ toast('复制失败，请手动选择复制'); }
  document.body.removeChild(ta);
}
/* ================= 主流程 ================= */
let mode='text', fileText='', fileName='';
const MAX_FILE=20000;
async function doTranslate(){
  if(busy) return;
  const raw = mode==='file' ? fileText.trim() : $('srcText').value.trim();
  if(!raw){
    if(mode==='file'){ toast('请先选择要翻译的文件'); }
    else{ $('srcText').focus(); toast('先输入要翻译的文字'); }
    return;
  }
  let from=$('fromLang').value, to=$('toLang').value;
  if(from===to && from!=='auto'){ toast('源语言和目标语言相同，请调整'); return; }
  if(from==='auto' && to==='auto'){ toast('请选择目标语言'); return; }

  busy=true;
  const go=$('goBtn'); go.disabled=true; go.textContent='翻译中';
  $('copyBtn').disabled=true;
  $('dlBtn').disabled=true;
  const OC=getOC();
  try{
    let text=raw;
    let twNote='';
    if(from==='zh-TW' && OC){ text=OC.t2s(text); from='zh-CN'; }
    if(from==='auto'){
      const det=detectLang(text);
      lastDetected=det;
      if(det==='zh-TW'){
        if(OC){ text=OC.t2s(text); from='zh-CN'; }
        else from='zh-TW';
      }else{
        from=det;
      }
    }
    let apiTo=to;
    if(to==='zh-TW') apiTo='zh-CN';

    let result;
    if(from===apiTo){
      /* 简繁互转等本地可完成的场景，不调用接口 */
      result=text;
      if(to==='zh-TW' && OC) result=OC.s2t(result);
      if(to==='zh-TW' && !OC) twNote='（简繁组件未加载，暂按原文输出）';
      await sleep(60);
    }else{
      setStatus('正在翻译…');
      result=await translateAll(text, from, apiTo, function(i,n){ setStatus('正在翻译 '+i+'/'+n+' 段…'); });
      if(to==='zh-TW' && OC) result=OC.s2t(result);
      if(to==='zh-TW' && !OC) twNote='（简繁组件未加载，暂按简体输出）';
    }

    const out=$('outText');
    out.textContent=result; out.classList.remove('placeholder');
    $('outMeta').textContent=countChars(result)+' 字符';
    $('copyBtn').disabled=false;
    $('dlBtn').disabled=false;
    const detTxt=(lastDetected && lastDetected!==from) ? ' · 检测为 '+LANGS[lastDetected] : '';
    setStatus('已翻译'+detTxt+twNote, 'ok');
    saveHistory(raw, result, from, to);
  }catch(err){
    const msg=String(err && err.message||err);
    if(/Failed to fetch|NetworkError|TypeError/i.test(msg)) setStatus('网络连接失败，请检查网络后重试', 'err');
    else if(/额度/.test(msg)) setStatus('今日免费额度已用尽，明天再来试试', 'err');
    else setStatus(msg, 'err');
    toast('翻译失败：'+msg);
  }finally{
    busy=false;
    go.disabled=false; go.textContent='翻 译';
  }
}
/* ================= 历史 ================= */
function loadHist(){ try{ return JSON.parse(localStorage.getItem(HIST_KEY))||[]; }catch(e){ return []; } }
function saveHist(h){ try{ localStorage.setItem(HIST_KEY, JSON.stringify(h)); }catch(e){} }
function saveHistory(src, dst, from, to){
  const h=loadHist();
  h.unshift({ from:from, to:to, src:src.slice(0,200), dst:dst.slice(0,200), ts:Date.now() });
  if(h.length>12) h.length=12;
  saveHist(h); renderHist();
}
function renderHist(){
  const h=loadHist(), list=$('histList');
  $('clearHist').disabled = !h.length;
  if(!h.length){
    list.innerHTML='<div class="empty-state">还没有翻译记录，翻译一次就会出现在这里</div>';
    return;
  }
  list.innerHTML=h.map(function(it,i){
    const f=LANGS[it.from]||it.from, t=LANGS[it.to]||it.to;
    return '<div class="hist-item" data-i="'+i+'" tabindex="0" role="button" aria-label="恢复这条翻译">'
      +'<div class="hist-badges"><span class="hist-tag">'+esc(f)+' → '+esc(t)+'</span><span class="hist-time">'+relativeTime(it.ts)+'</span></div>'
      +'<div class="hist-body"><div class="hist-line">'+esc(it.src)+'</div><div class="hist-line">'+esc(it.dst)+'</div></div>'
      +'<button type="button" class="hist-del" data-i="'+i+'" aria-label="删除这条记录"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/><path d="M6.5 7l1 13h9l1-13"/></svg></button>'
      +'</div>';
  }).join('');
}
function restoreHist(i){
  const h=loadHist(); if(!h[i]) return;
  const it=h[i];
  $('fromLang').value=it.from; $('toLang').value=it.to;
  $('srcText').value=it.src; updateMeta();
  const out=$('outText'); out.textContent=it.dst; out.classList.remove('placeholder');
  $('outMeta').textContent=countChars(it.dst)+' 字符';
  $('copyBtn').disabled=false;
  lastDetected='';
  setStatus('已恢复最近翻译，可点击“翻译”重新翻译', 'ok');
}
/* ================= 交互绑定 ================= */
function updateMeta(){
  $('srcMeta').textContent=countChars($('srcText').value)+' 字符';
}
$('goBtn').addEventListener('click', doTranslate);
$('srcText').addEventListener('input', updateMeta);
$('srcText').addEventListener('keydown', function(e){
  if((e.ctrlKey||e.metaKey) && e.key==='Enter'){ e.preventDefault(); doTranslate(); }
});
$('clearBtn').addEventListener('click', function(){
  $('srcText').value=''; updateMeta();
  $('srcText').focus(); setStatus('等待输入…');
});
$('copyBtn').addEventListener('click', function(){
  const out=$('outText');
  if(out.classList.contains('placeholder')) return;
  copyText(out.textContent);
});
$('swapBtn').addEventListener('click', function(){
  const f=$('fromLang'), t=$('toLang');
  const out=$('outText');
  let from=f.value, to=t.value;
  if(from==='auto'){ from=to; to=lastDetected || (from==='en'?'zh-CN':'en'); }
  f.value=from; t.value=to;
  if(!out.classList.contains('placeholder')){
    $('srcText').value=out.textContent;
    out.textContent=''; out.classList.add('placeholder');
    $('outMeta').textContent='0 字符';
    $('copyBtn').disabled=true;
    lastDetected='';
  }
  updateMeta();
  setStatus('语言已交换，重新翻译试试');
});
document.querySelectorAll('.chip').forEach(function(ch){
  ch.addEventListener('click', function(){
    $('srcText').value=ch.dataset.s; updateMeta();
    doTranslate();
  });
});
$('histList').addEventListener('click', function(e){
  const del=e.target.closest('.hist-del');
  if(del){
    e.stopPropagation();
    const h=loadHist(); h.splice(Number(del.dataset.i),1); saveHist(h); renderHist();
    return;
  }
  const item=e.target.closest('.hist-item');
  if(item) restoreHist(Number(item.dataset.i));
});
$('clearHist').addEventListener('click', function(){
  saveHist([]); renderHist(); toast('已清空翻译记录');
});
/* ================= 文件模式 ================= */
function setMode(m){
  mode=m;
  const card=$('translatorCard');
  [...document.querySelectorAll('#modeSeg button')].forEach(function(b){
    b.classList.toggle('on', b.dataset.mode===m);
    b.setAttribute('aria-selected', b.dataset.mode===m);
  });
  card.classList.toggle('file-mode', m==='file');
  $('fileMode').hidden = (m!=='file');
}
function clearFile(){
  fileText=''; fileName='';
  $('fileInput').value='';
  $('fileInfo').hidden=true;
}
function handleFile(f){
  if(!f) return;
  fileName=f.name;
  const reader=new FileReader();
  reader.onload=function(){
    let text=String(reader.result||'');
    if(text.length>MAX_FILE){
      text=text.slice(0,MAX_FILE);
      toast('文件较大，仅翻译前 '+MAX_FILE+' 字符');
    }
    fileText=text;
    $('fileName').textContent=f.name;
    const kb=f.size/1024;
    $('fileSize').textContent=(kb>512? (kb/1024).toFixed(1)+' MB' : kb.toFixed(0)+' KB')+' · '+text.length+' 字符';
    $('filePreview').textContent=text.slice(0,160).replace(/\s+/g,' ')+(text.length>160?'…':'');
    $('fileInfo').hidden=false;
    setStatus('已加载文件「'+f.name+'」，点击翻译', 'ok');
  };
  reader.onerror=function(){ toast('文件读取失败，请换一个文本文件'); };
  reader.readAsText(f);
}
function downloadTxt(text){
  const blob=new Blob(['\ufeff'+text],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a');
  const base=(fileName||'result').replace(/\.[^.]+$/,'')||'result';
  a.href=URL.createObjectURL(blob);
  a.download=base+'.'+$('toLang').value+'.txt';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); },1000);
  toast('译文已开始下载');
}
document.getElementById('modeSeg').addEventListener('click', function(e){
  const b=e.target.closest('button'); if(!b) return;
  setMode(b.dataset.mode);
});
document.getElementById('dropZone').addEventListener('click', function(){
  $('fileInput').click();
});
document.getElementById('dropZone').addEventListener('keydown', function(e){
  if(e.key==='Enter'||e.key===' '){ e.preventDefault(); $('fileInput').click(); }
});
['dragover','dragenter'].forEach(function(ev){
  $('dropZone').addEventListener(ev, function(e){ e.preventDefault(); this.classList.add('drag'); });
});
['dragleave','drop'].forEach(function(ev){
  $('dropZone').addEventListener(ev, function(e){ e.preventDefault(); this.classList.remove('drag'); });
});
$('dropZone').addEventListener('drop', function(e){
  const f=e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
  handleFile(f);
});
$('fileInput').addEventListener('change', function(){
  handleFile(this.files[0]);
});
$('fileRemove').addEventListener('click', function(){
  clearFile(); setStatus('已移除文件', '');
});
$('dlBtn').addEventListener('click', function(){
  const out=$('outText');
  if(out.classList.contains('placeholder')) return;
  downloadTxt(out.textContent);
});
/* ================= 初始化 ================= */
/* OpenCC 兜底：页面加载后仍未加载成功则再试一次备用源 */
window.addEventListener('load', function(){
  setTimeout(function(){
    if(!window.OpenCC){
      var s=document.createElement('script');
      s.src='https://unpkg.com/opencc-js@1.0.5/dist/umd/full.js';
      document.head.appendChild(s);
    }
  },1500);
});
renderHist();
</script>
